name: PostgreSQL concurrency integration

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/production-ready/**'
      - 'supabase/proposed/**'
      - 'tests/postgres/**'
      - '.github/workflows/postgres-concurrency.yml'
  push:
    branches:
      - chore/ci-regression-tests
    paths:
      - 'supabase/migrations/**'
      - 'supabase/production-ready/**'
      - 'supabase/proposed/**'
      - 'tests/postgres/**'
      - '.github/workflows/postgres-concurrency.yml'

permissions:
  contents: read

jobs:
  quota-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fimela_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fimela_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: fimela_test
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 17 — concurrency and reservation lifecycle
        run: bash tests/postgres/ia-usage-concurrency.sh
      - name: PostgreSQL 17 — MFA, paie and adjoint authorization guards
        run: bash tests/postgres/security-guards-integration.sh
      - name: PostgreSQL 17 — roles admin_mairie, statuts, anti-élévation, isolation
        run: bash tests/postgres/roles-admin-mairie-integration.sh
      - name: PostgreSQL 17 — droits admin_mairie (correctif)
        run: bash tests/postgres/org-role-droit-set-integration.sh
      - name: PostgreSQL 17 — indicateurs KPI v2
        run: bash tests/postgres/org-kpi-integration.sh
      - name: PostgreSQL 17 — notifications push et SMS
        run: bash tests/postgres/notifications-sms-integration.sh
