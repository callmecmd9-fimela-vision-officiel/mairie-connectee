name: pwa-build
on:
  push:
    branches: [main]
    paths: [mairie.html, index.html]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 pwa_build.py .
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "PWA + découpage automatique" && git push
          
