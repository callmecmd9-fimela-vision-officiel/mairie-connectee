<!doctype html>
<html lang="fr" data-mode="cit"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><script src="/js/pwa-init.js"></script>
<link rel="manifest" href="/manifest-citoyen.webmanifest"><meta name="theme-color" content="#0B5A2E"><link rel="icon" type="image/png" href="/icon-citoyen-192.png"><link rel="apple-touch-icon" href="/icon-citoyen-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Mairie Connectée</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--g:#0B5A2E;--gold:#F2B705;--bg:#F3F6F1;--tx:#14231A;--mut:#566259;--ln:#E0E8DE;--r:16px;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 'Nunito Sans',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}p{margin:0 0 10px}
:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid #BFCBBF;border-radius:12px;background:#fff}
label{display:block;font:700 13px 'Nunito Sans';color:var(--mut);margin:12px 0 4px}
.bt,.bo,.bg{min-height:48px;padding:0 20px;border-radius:12px;font-weight:800;cursor:pointer;border:0}
.bt{background:var(--g);color:#fff}.bg{background:var(--gold);color:var(--tx)}.bo{background:#fff;border:2px solid var(--g);color:var(--g)}
.hd{background:linear-gradient(160deg,#0E5A2F,#073A1E);color:#fff;padding:22px 20px 56px}
.in{max-width:900px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{background:#DCFCE7;color:#166534;border-radius:99px;padding:4px 12px;font-weight:800;font-size:13px}
.lk{background:none;border:0;color:#CFE6D5;text-decoration:underline;cursor:pointer;font-size:14px;min-height:36px}
.hd h1{font:800 clamp(26px,5vw,38px)/1.15 'Nunito Sans';margin:14px 0 4px}.sl{font-style:italic;color:#D6E8DA}
.mn{margin:-34px auto 0;max-width:900px;padding:0 16px 40px}
.cd{background:#fff;border-radius:var(--r);box-shadow:0 4px 18px rgba(11,79,42,.12);padding:18px;margin-bottom:16px}
.cd h2{font:800 20px 'Nunito Sans';margin-bottom:8px}
.sr{position:relative}.sr input{padding-left:44px;min-height:52px;background:#F3F6F1}.sr svg{position:absolute;left:14px;top:15px;color:var(--mut)}
.tl{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin-top:14px}
.tt{display:flex;flex-direction:column;gap:6px;text-align:left;background:#fff;border:2px solid #D5E3D3;border-radius:14px;padding:14px;min-height:118px;cursor:pointer}
.tt:hover{border-color:var(--g)}.tt svg{color:#16A34A}.tt b{font-weight:800;font-size:17px;line-height:1.2}.tt span{font-size:13px;color:var(--mut)}
.rw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.rw:first-of-type{border-top:0}
.nb{min-width:34px;height:34px;border-radius:99px;display:grid;place-items:center;font-weight:800;padding:0 8px}
.b1{background:#DBEAFE;color:#1E40AF}.b2{background:#FFEDD5;color:#9A3412}.b3{background:#DCFCE7;color:#166534}
.bd{display:inline-block;border-radius:99px;padding:3px 12px;font-weight:800;font-size:13px;background:#FEF3C7;color:#92400E}.bd.ok{background:#DCFCE7;color:#166534}.bd.bl{background:#DBEAFE;color:#1E40AF}
.stp{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}.stp i{display:block;height:6px;border-radius:99px;background:#E5E7EB}.stp i.on{background:#16A34A}.stp small{display:block;font-size:11px;color:var(--mut);margin-top:4px;text-align:center}
.al{background:#FEE2E2;color:#7F1D1D;border-radius:12px;padding:12px 14px;font-weight:700;margin-bottom:14px}.okb{background:#DCFCE7;color:#14532D;border-radius:12px;padding:14px;margin-bottom:14px}
.hp{background:#E8F5EA;border-radius:var(--r);padding:16px;display:flex;gap:12px;align-items:flex-start}
.mu{color:var(--mut)}.sm{font-size:13px}
.hs{padding:0 0 0 18px;margin:6px 0}
@media print{.hd,.bt,.bo{display:none}}
</style></head><body><div id="app"></div>
<script src="/js/guard.js?v=1794657023"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=tsReady" async defer></script>
<script src="/js/citoyen.js?v=1794657023"></script></body></html>
