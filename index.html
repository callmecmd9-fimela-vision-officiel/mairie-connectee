<button id="btn-ouvrir-signalement" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000; background-color: #d32f2f; color: white; border: none; border-radius: 50px; padding: 15px 20px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer;">
  🚨 Signaler
</button>

<div id="modal-signalement" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10000; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box;">
  <div style="background: white; width: 100%; max-width: 500px; border-radius: 12px; padding: 20px; max-height: 90vh; overflow-y: auto; position: relative;">
    <button id="btn-fermer-signalement" style="position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer;">&times;</button>
    <h2 style="margin-top: 0; color: #333;">🚨 Signaler un problème</h2>
    <form id="form-signalement">
      <div style="margin-bottom: 15px;">
        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Catégorie</label>
        <select id="signalement-categorie" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
          <option value="">-- Choisir --</option>
          <option value="voirie">🛣️ Voirie / Nid-de-poule</option>
          <option value="ordures">🗑️ Dépôt d'ordures</option>
          <option value="eclairage">💡 Éclairage public</option>
          <option value="assainissement">🌊 Assainissement / Caniveau</option>
        </select>
      </div>
      <div style="margin-bottom: 15px;">
        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Description</label>
        <textarea id="signalement-description" required rows="3" placeholder="Décrivez le problème..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;"></textarea>
      </div>
      <div style="margin-bottom: 15px;">
        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Photo (Optionnel)</label>
        <input type="file" id="signalement-photo" accept="image/*" capture="environment" style="width: 100%;">
      </div>
      <div style="margin-bottom: 15px;">
        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Localisation (Cliquez sur la carte)</label>
        <div id="map-signalement" style="height: 200px; width: 100%; border-radius: 8px; border: 1px solid #ccc;"></div>
      </div>
      <button type="submit" id="btn-envoyer-signalement" style="width: 100%; background: #1976d2; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;">
        Envoyer le signalement
      </button>
    </form>
  </div>
</div>
<script src="/js/i18n.js?v=20261121.1"></script><script src="/js/citoyen.js?v=20261123.1"></script></body></html>
