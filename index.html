<!doctype html>
<html lang="fr" data-mode="cit"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><script src="/js/pwa-init.js"></script>
<link rel="manifest" href="/manifest-citoyen.webmanifest"><meta name="theme-color" content="#0B5A2E"><link rel="icon" type="image/png" href="/icon-citoyen-192.png"><link rel="apple-touch-icon" href="/icon-citoyen-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Mairie Connectée</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--g:#0B5A2E;--gold:#F2B705;--bg:#F3F6F1;--tx:#14231A;--mut:#566259;--ln:#E0E8DE;--r:16px;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 'Nunito Sans',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}p{margin:0 0 10px}
:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid #BFCBBF;border-radius:12px;background:#fff}
label{display:block;font:700 13px 'Nunito Sans',system-ui,sans-serif;color:var(--mut);margin:12px 0 4px}
.bt,.bo,.bg{min-height:48px;padding:0 20px;border-radius:12px;font-weight:800;cursor:pointer;border:0}
.bt{background:var(--g);color:#fff}.bg{background:var(--gold);color:var(--tx)}.bo{background:#fff;border:2px solid var(--g);color:var(--g)}
.hd{background:linear-gradient(160deg,#0E5A2F,#073A1E);color:#fff;padding:26px 20px 64px}
.in{max-width:1100px;margin:0 auto}
.pill{background:#DCFCE7;color:#166534;border-radius:99px;padding:4px 12px;font-weight:800;font-size:13px}
.lk{background:none;border:0;color:#CFE6D5;text-decoration:underline;cursor:pointer;font-size:14px;min-height:44px}
.hd h1{font:800 clamp(26px,5vw,38px)/1.15 'Nunito Sans',system-ui,sans-serif;margin:14px 0 4px}.sl{font-style:italic;color:#D6E8DA}
.mn{margin:-34px auto 0;max-width:1100px;padding:0 16px 40px}
.mn.nh{margin:18px auto 0;max-width:760px}.mn.hm{margin:0 auto;padding-top:22px}
.cd{background:#fff;border-radius:var(--r);box-shadow:0 4px 18px rgba(11,79,42,.12);padding:18px;margin-bottom:16px}
.cd h1,.cd h2{font:800 20px 'Nunito Sans',system-ui,sans-serif;margin-bottom:8px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.rw:first-of-type{border-top:0}
.nb{min-width:34px;height:34px;border-radius:99px;display:grid;place-items:center;font-weight:800;padding:0 8px}
.b1{background:#DBEAFE;color:#1E40AF}.b2{background:#FFEDD5;color:#9A3412}.b3{background:#DCFCE7;color:#166534}
.bd{display:inline-block;border-radius:99px;padding:3px 12px;font-weight:800;font-size:13px;background:#FEF3C7;color:#92400E}.bd.ok{background:#DCFCE7;color:#166534}.bd.bl{background:#DBEAFE;color:#1E40AF}
.stp{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}.stp i{display:block;height:6px;border-radius:99px;background:#E5E7EB}.stp i.on{background:#16A34A}.stp small{display:block;font-size:11px;color:var(--mut);margin-top:4px;text-align:center}
.al{background:#FEE2E2;color:#7F1D1D;border-radius:12px;padding:12px 14px;font-weight:700;margin-bottom:14px}.okb{background:#DCFCE7;color:#14532D;border-radius:12px;padding:14px;margin-bottom:14px}
.mu{color:var(--mut)}.sm{font-size:13px}
.hs{padding:0 0 0 18px;margin:6px 0}
.sk{position:absolute;left:-999px;top:0;background:#fff;color:var(--g);padding:10px 14px;font-weight:800;z-index:99}.sk:focus{left:8px;top:8px}
.gl{color:var(--gold)}
/* ---- En-tête (logo, navigation, Mon espace, menu mobile) ---- */
.tp{background:#fff;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:30;padding:8px 16px}
.hdr{display:flex;align-items:center;gap:12px}
.hn{min-width:0;flex:1 1 auto}.tn{display:block;font:800 19px/1.15 'Nunito Sans',system-ui,sans-serif;color:var(--g);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ts{display:block;color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm{display:inline-grid;place-items:center;border-radius:99px;min-height:46px;padding:0 16px;flex:none;font-size:15px}
.nv{display:none;gap:2px;margin:0 auto}.nl{background:none;border:0;min-height:46px;padding:0 10px;font-weight:700;color:var(--tx);border-radius:10px;cursor:pointer;font-size:15px}.nl:hover{background:#EAF3EA;color:var(--g)}
.mb{display:grid;place-items:center;width:48px;height:48px;border:0;background:none;color:var(--g);cursor:pointer;flex:none;border-radius:12px}
.mnv{display:grid;border-top:1px solid var(--ln);margin:8px -16px -8px;padding:4px 16px 10px;background:#fff}
.ml{min-height:52px;text-align:left;font-weight:800;font-size:17px;border:0;background:none;border-bottom:1px solid var(--ln);padding:0 6px;cursor:pointer}
@media(min-width:1000px){.nv{display:flex}.mb,.mnv{display:none}.hn{flex:0 1 auto}}
@media(max-width:480px){.ts{display:none}.tn{font-size:16px;white-space:normal;line-height:1.1}.tm{padding:0 12px;font-size:14px}.hdr{gap:8px}.hdr .bz,.hdr>svg{width:44px!important;height:44px!important}}
/* ---- Bannière ---- */
.hero{position:relative;background:linear-gradient(120deg,#0B5A2E 0%,#0D6B35 55%,#073A1E 100%);color:#fff;overflow:hidden}
.hph{position:absolute;top:0;right:0;bottom:0;width:60%;display:block}
.hph img{width:100%;height:100%;object-fit:cover;object-position:center 45%;display:block;-webkit-mask-image:linear-gradient(to right,transparent 0,rgba(0,0,0,.92) 48%);mask-image:linear-gradient(to right,transparent 0,rgba(0,0,0,.92) 48%)}
.hc{position:relative;padding:44px 20px 84px}
.hero h1{font:800 clamp(28px,4.6vw,46px)/1.12 'Nunito Sans',system-ui,sans-serif;max-width:640px;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.sg{font:italic 800 clamp(22px,3.6vw,34px)/1.2 'Nunito Sans',system-ui,sans-serif;color:var(--gold);margin:8px 0 10px}
.hsub{max-width:520px;color:#EAF4EC}
.sr2{display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:5px 5px 5px 16px;max-width:560px;margin-top:16px;color:var(--mut);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.sr2 svg{flex:none}.sr2 input{border:0;background:transparent;min-height:46px;padding:0 4px;flex:1;min-width:0}.sr2 input:focus-visible{outline:0}.sr2:focus-within{outline:3px solid #2563EB}
.sr2 .bt{border-radius:99px;flex:none}@media(max-width:480px){.sr2>svg{display:none}.sr2{padding-left:14px}}
@media(max-width:720px){.hph{position:relative;width:100%;height:170px}.hph img{-webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent);mask-image:linear-gradient(to bottom,#000 55%,transparent)}.hc{padding:4px 16px 70px}.hero:not(.ph) .hc{padding-top:28px}.sr2 .bt{padding:0 14px}}
/* ---- 3 grandes cartes ---- */
.c3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:-44px;position:relative;padding:0 16px}
.a3{display:flex;align-items:center;gap:14px;text-align:left;min-height:92px;padding:14px 16px;border:0;border-radius:18px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#0B5A2E,#14803F);box-shadow:0 8px 22px rgba(11,79,42,.28);transition:transform .2s,box-shadow .2s}
.a3.y{background:linear-gradient(135deg,#F2B705,#FFD34E);color:var(--tx)}
.a3:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(11,79,42,.32)}
.a3 .at{flex:1;min-width:0}.a3 b{display:block;font:800 19px/1.2 'Nunito Sans',system-ui,sans-serif}.a3 small{display:block;font-size:14px;line-height:1.3}
.ar{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--g);display:grid;place-items:center;flex:none}
@media(max-width:860px){.c3{grid-template-columns:1fr;margin-top:-30px;gap:10px}}
/* ---- Services ---- */
.sw{display:grid;grid-template-columns:1fr 280px;gap:16px;margin-bottom:16px;align-items:start}
@media(max-width:900px){.sw{grid-template-columns:1fr}}
.sh{font:800 24px 'Nunito Sans',system-ui,sans-serif;margin:6px 0 12px;padding-left:12px;border-left:4px solid var(--gold)}
.tl{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tt{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid #D5E3D3;border-radius:14px;padding:12px 14px;min-height:88px;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.tt:hover{border-color:var(--g);transform:translateY(-2px);box-shadow:0 6px 16px rgba(11,79,42,.15)}
.ico{flex:none;width:50px;height:50px;border-radius:14px;background:#E8F5EA;color:var(--g);display:grid;place-items:center}
.ico.big{margin:0 auto 8px;width:58px;height:58px;border-radius:50%}
.tx{display:flex;flex-direction:column;gap:2px;min-width:0}.tx b{font-weight:800;font-size:16px;line-height:1.2}.tx span{font-size:13px;color:var(--mut);line-height:1.3}
.ac{text-align:center;background:linear-gradient(#F4FAF1,#E4F1E0)}
.lk2{background:none;border:0;color:var(--g);text-decoration:underline;font-weight:700;min-height:44px;cursor:pointer}
/* ---- Suivi, infos, contact, actualités ---- */
.sv{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:linear-gradient(90deg,#0B5A2E,#14803F);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:16px}.sv>div{flex:1 1 220px}.sv input{flex:2 1 220px}.sv .sm{color:#D6E8DA}
.g2c{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.ih{display:inline-grid;vertical-align:middle;color:var(--g)}
.ctb{display:grid;gap:10px}.cl{display:flex;align-items:center;justify-content:center;text-decoration:none;min-height:52px}
.an{border-top:1px solid var(--ln);padding-top:10px}
.ft{background:var(--g);color:var(--gold);text-align:center;padding:18px;font:italic 700 20px 'Nunito Sans',system-ui,sans-serif}
#top,#services,#suivi,#travaux,#infos,#contact,#actus{scroll-margin-top:84px}
/* ---- Chargement ---- */
#ld{display:grid;place-items:center;align-content:center;gap:12px;min-height:60vh;color:var(--g);font-weight:800}
#app:not(:empty)+#ld{display:none}
#ld i{width:38px;height:38px;border-radius:50%;border:4px solid #D5E3D3;border-top-color:var(--g);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.hd,.tp,.hero,.c3,.bt,.bo{display:none}}
/* ---- Lots 1-2 : grandes cartes + boîte de dialogue ---- */
.tt.big{min-height:104px}.tt.big .tx b{font-size:18px}
#dlg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}#dlg[hidden]{display:none}
.dlb{background:#fff;width:100%;max-width:640px;height:100%;display:flex;flex-direction:column;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){#dlg{align-items:center}.dlb{height:auto;max-height:85vh;border-radius:18px}}
.dlh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.dlh h2{font:800 22px/1.2 'Nunito Sans',system-ui,sans-serif}
.dlx{width:48px;height:48px;border:0;background:#EEF3EC;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--g);flex:none}
.dsr{display:flex;align-items:center;gap:8px;border:2px solid var(--g);border-radius:99px;padding:2px 14px;color:var(--mut);margin-bottom:10px}.dsr input{border:0;min-height:44px;flex:1;min-width:0;background:transparent;padding:0}.dsr input:focus-visible{outline:0}.dsr:focus-within{outline:3px solid #2563EB}
.dlc{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;flex:none}.chp{flex:none;min-height:44px;padding:0 16px;border-radius:99px;border:2px solid var(--g);background:#fff;color:var(--g);font-weight:700;cursor:pointer}.chp.on{background:var(--g);color:#fff}
.dll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}.dli{border-top:1px solid var(--ln);padding:12px 0}.dli p{margin:4px 0}
@media print{#dlg{display:none}}
</style></head><body><div id="app"></div><div id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlt" hidden></div><div id="ld" role="status"><i aria-hidden="true"></i>Chargement…</div><noscript><p style="padding:24px">Ce portail nécessite JavaScript.</p></noscript>
