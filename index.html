const cit=()=>{const r=S.tr&&S.res?{t:S.res.type,st:RS[RC.indexOf(S.res.statut)]}:null,nw=S.pub;
return `<div class="hero">${bar("Commune de "+esc(S.co),"Changer")}<h1>Votre mairie,<br><i>plus proche de vous</i></h1><p>Démarches, rendez-vous et informations, à toute heure.</p></div><main class="cm">
<div class="card"><label for="tk">Suivre ma demande</label><div class="top"><input id="tk" placeholder="Numéro de suivi" value="${esc(S.tr)}"><button class="b" data-a="track">Suivre</button></div>${S.tr?(r?`<p><b>${esc(r.t)}</b> : ${esc(r.st)}</p><div class="steps">${RS.map((x,i)=>`<i class="${i<=RS.indexOf(r.st)?"on":""}"></i>`).join("")}</div>`:'<p class="mut">Aucune demande avec ce numéro. Vérifiez-le et réessayez.</p>'):""}</div>
<div class="card"><h2>Nouvelle demande</h2>${S.err?`<p role="alert"><b>${esc(S.err)}</b></p>`:""}${S.ok?`<p><b>Demande enregistrée.</b> Votre numéro de suivi : ${esc(S.ok)}</p>`:""}<div class="fr"><div><label for="qt">Type de demande</label><select id="qt"><option>État civil</option><option>Rendez-vous avec le Maire</option><option>Signalement</option><option>Autre demande</option></select></div><div><label for="qn">Votre nom</label><input id="qn"></div></div><label for="qm">Votre message</label><textarea id="qm" rows="4"></textarea><div id="ts"></div><p><button class="b" data-a="newreq">Envoyer ma demande</button></p></div>
<h2>Actualités</h2>${nw.map(p=>`<div class="row"><div class="sr"><i>${esc(p.texte)}</i></div></div>`).join("")}${nw.length?"":'<p class="mut">Pas encore d’actualité publiée.</p>'}</main>`};
function render(){$("#app").innerHTML=!S.role?login():S.role=="cab"?cab():cit();S.tok="";if($("#ts")&&window.turnstile&&!TS_KEY.startsWith("VOTRE"))try{turnstile.render("#ts",{sitekey:TS_KEY,language:"fr",callback:x=>{S.tok=x}})}catch(e){}}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-a]");if(!t)return;
const a=t.dataset.a,i=+t.dataset.i,g=id=>(($("#"+id)||{}).value||"").trim(),d=D(),c=S.cid,run=async p=>{const r=await p;if(r.error)S.err=r.error.message;return r};
if(a=="ia"){const out=$("#iar");try{out.textContent="Écriture en cours…";t.disabled=true;const r=await sb.functions.invoke("ia-texte",{body:{commune:slug(),sujet:g("ps"),reseau:g("pr")}});t.disabled=false;
if(r.error){let m="IA indisponible pour le moment.";try{m=(await r.error.context.json()).error||m}catch(x){}out.textContent=m;return}
S.ia=r.data.textes||[];out.innerHTML=S.ia.map((x,i)=>`<div class="card"><i>${esc(x)}</i><p><button class="tag" data-a="useia" data-i="${i}">Utiliser ce texte</button></p></div>`).join("")}catch(x){t.disabled=false;if(out)out.textContent="IA indisponible pour le moment."}return}
if(a=="useia"){$("#pt").value=(S.ia||[])[i]||"";return}
if(a=="idea"){$("#pt").value=P[Math.floor(Math.random()*P.length)].replace("{c}",S.co);return}
if(a=="copy"){try{navigator.clipboard.writeText(d.posts[i].t);t.textContent="Copié"}catch(x){}return}
S.err="";
try{
if(a=="enter"){S.co=g("co")||S.co;S.tr="";S.ok="";S.res=null;
if(t.dataset.r=="cit"){S.role="cit";S.view="home";await load()}
else{const em=g("em"),pw=($("#pw")||{}).value||"",up=t.dataset.m=="up";
if(!S.tok){S.err="Veuillez valider la vérification anti-spam, puis réessayer."}else{
const r=up?await sb.auth.signUp({email:em,password:pw,options:{data:{commune:slug()},captchaToken:S.tok}}):await sb.auth.signInWithPassword({email:em,password:pw,options:{captchaToken:S.tok}});
if(r.error)S.err=r.error.message;else if(up&&!r.data.session)S.err="Compte créé. Confirmez votre e-mail, puis connectez-vous.";else if(await profil())await load()}}}
else if(a=="out"){await sb.auth.signOut();S.role=null;S.cid=null;S.sa=false;S.db=E0}
else if(a=="go")S.view=t.dataset.v;
else if(a=="filt")S.f=t.dataset.f;
else if(a=="theme"){const h=document.documentElement,dk=h.dataset.theme?h.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;h.dataset.theme=dk?"light":"dark"}
else if(a=="track"){S.tr=g("tk").toUpperCase();S.ok="";S.res=((await run(sb.rpc("suivre_demande",{p_commune:slug(),p_numero:S.tr}))).data||[])[0]||null}
else if(a=="newreq"){if(g("qn")&&g("qm")){
if(TS_KEY.startsWith("VOTRE"))S.err="Protection anti-spam non configurée.";
else if(!S.tok)S.err="Veuillez valider la vérification anti-spam, puis réessayer.";
else{const ty=g("qt"),sg=await sb.auth.signInAnonymously({options:{captchaToken:S.tok}});
if(sg.error)S.err="Vérification refusée. Réessayez.";
else{const r=await sb.rpc("creer_demande",{p_commune:slug(),p_type:ty,p_nom:g("qn"),p_message:g("qm")});await sb.auth.signOut();
if(r.error)S.err="Envoi impossible. Vérifiez les champs et réessayez.";else{S.tr=r.data;S.ok=r.data;S.res={type:ty,statut:"nouvelle"}}}}}}
else if(a=="sw"){const c=S.cs[i];S.co=c.nom;S.cid=c.id;await load()}
else if(a=="addcom"){const n=g("cn"),sl=n.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");if(n&&sl){await run(sb.from("communes").insert({slug:sl,nom:n}));await lc();await load()}}
else if(a=="deluser"){const u=S.adm[i];if(u&&confirm("Supprimer définitivement le compte "+u.email+" ?")){if(await fn({action:"supprimer",id:u.id}))S.err="Compte supprimé.";await load()}}
else if(a=="mk"){if(await fn({action:"creer",nom:g("nn"),email:g("ne"),password:($("#np")||{}).value||"",role:g("nr"),commune:g("nc")}))S.err="Compte créé. Communiquez-lui son mot de passe de façon sûre.";await load()}
else if(a=="addphoto"){const f=($("#pf")||{}).files&&$("#pf").files[0],ti=g("pt2");if(f&&ti){const bl=await comp(f),pa=c+"/"+crypto.randomUUID()+"."+(bl.type=="image/webp"?"webp":"jpg"),up=await sb.storage.from("medias").upload(pa,bl,{contentType:bl.type});if(up.error)S.err="Envoi impossible : "+up.error.message;else{const r=await run(sb.from("medias").insert({commune_id:c,type:"photo",titre:ti,chemin:pa}));if(!r.error)S.err="Photo enregistrée : "+kb(f.size)+" réduits à "+kb(bl.size)+"."}}else S.err="Choisissez une photo et un titre.";await load()}
else if(a=="addvideo"){if(g("vt")&&/^https:\/\//.test(g("vu")))await run(sb.from("medias").insert({commune_id:c,type:"video",titre:g("vt"),url:g("vu")}));else S.err="Indiquez un titre et un lien commençant par https://";await load()}
else if(a=="delmed"){const m=d.med[i];if(m&&confirm("Retirer ce média ?")){if(m.ty=="photo")await sb.storage.from("medias").remove([m.p]);await run(sb.from("medias").delete().eq("id",m.id));await load()}}
else if(a=="attr"){await run(sb.rpc("admin_attribuer",{p_email:g("ae"),p_role:g("ar"),p_slug:g("ac")}));await load()}
else{
if(a=="addrdv"){if(g("rt"))await run(sb.from("rdv").insert({commune_id:c,jour:g("rd")||T,heure:g("rh")||"09:00",titre:g("rt")}))}
else if(a=="delrdv")await run(sb.from("rdv").delete().eq("id",d.rdv[i].id));
else if(a=="addmail"){if(g("mo"))await run(sb.from("courrier").insert({commune_id:c,sens:g("ms"),correspondant:g("mf")||"Non précisé",objet:g("mo")}));S.f=g("ms")||S.f}
else if(a=="cycm"){const m=d.mail[i];await run(sb.from("courrier").update({statut:MC[(MS.indexOf(m.st)+1)%MS.length]}).eq("id",m.id))}
else if(a=="cycr"){const m=d.req[i];await run(sb.from("demandes").update({statut:RC[(RS.indexOf(m.st)+1)%RS.length]}).eq("id",m.id))}
else if(a=="addpost"){if(g("pt"))await run(sb.from("publications").insert({commune_id:c,reseau:g("pr"),jour:g("pd")||T,texte:g("pt"),media_id:g("pm")||null}))}
else if(a=="nextp"){const p=d.posts[i],k=PS.indexOf(p.st);if(k<3)await run(sb.from("publications").update({statut:PS[k+1]}).eq("id",p.id))}
else if(a=="delp")await run(sb.from("publications").delete().eq("id",d.posts[i].id));
await load()}
}catch(x){S.err="Erreur réseau. Réessayez."}
render();window.scrollTo(0,0)});
(async()=>{try{await lc();const x=(await sb.auth.getSession()).data.session;if(x&&await profil())await load()}catch(e){}render()})();
</script></body></html>
