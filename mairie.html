const donut=(segs,c1,c2)=>{const tot=segs.reduce((s,x)=>s+x.v,0)||1,R=52,C=2*Math.PI*R;let o=0;

rapports:()=>{const s=stat();return page("Rapports et Statistiques",`<p class="noprint"><button class="bt" data-a="print">Imprimer / PDF</button> <button class="bo" data-a="csv" data-k="projets">Exporter les projets (CSV)</button> <button class="bo" data-a="csv" data-k="demandes">Exporter les demandes (CSV)</button></p><div class="kp">${kp("k1","users","Population",fmt(s.I.population))}${kp("k2","tools","Projets",s.pr.length)}${kp("k3","mail","Demandes",s.d.req.length)}${kp("k4","doc","Délibérations "+Y,s.dels)}${kp("k5","coins","Exécution budget",s.ex+"%")}</div><div class="g3">${pn("Évolution des Finances","trend",lineC(s.d.fin))}${pn("Avancement des Projets","pie",progP(s))}${pn("Répartition des Investissements","chart",invP(s))}</div>`)},
comm:()=>page("Communication",tabs("com",[["pub","Publications"],["med","Médiathèque"]])+(S.tab.com=="pub"?pubv():medv())),
params:()=>{const I=S.ind,up=(k,l,f)=>`<div class="rw"><div class="rl"><b>${l}</b><div>${url(k)?`<img class="th" src="${esc(url(k))}" alt="${l}">`:'<span class="mut">Aucune image</span>'}</div></div><div style="display:grid;gap:6px"><input type="file" id="${f}" accept="image/*" aria-label="${l}"><button class="bo" data-a="upimg" data-k="${k}" data-f="${f}">Envoyer</button></div></div>`;
return page("Paramètres",pn("Indicateurs de la commune","gear",frm(inp("pp","Population","number",I.population||0)+inp("pg","Croissance (%)","number",I.croissance||0,"",'step="0.1"')+inp("pv","Villages et localités","number",I.villages||0)+inp("pm","Ménages recensés","number",I.menages||0)+inp("pa","Agents municipaux","number",I.agents||0)+inp("pb","Budget annuel (FCFA)","number",I.budget_annuel||0)+inp("psl","Slogan","text",I.slogan||"")+inp("pdv","Devise","text",I.devise||"")+inp("pla","Latitude du centre","text",I.centre_lat??"")+inp("plo","Longitude du centre","text",I.centre_lng??"")+inp("pz","Zoom de la carte","number",I.zoom||11,"",'min="3" max="18"')+`<button class="bt" data-a="saveind">Enregistrer</button>`))+pn("Images","gear",up("blason","Blason","ub")+up("photo_maire","Photo du Maire","um")+up("bandeau","Bandeau d’accueil","uo")))}};
const cab=()=>{const V0=V[S.view]||V.dash;return `<aside class="sb${S.menu?" open":""}">${brand()}<nav>${NAV().map(n=>`<button class="nvb${S.view==n[0]?" on":""}" data-a="go" data-v="${n[0]}">${ic(n[2],22)}<span>${n[1]}</span></button>`).join("")}</nav><div class="sp"></div><hr><button class="nvb" data-a="out">${ic("out",22)}<span>Déconnexion</span></button><div class="dv">${esc(S.ind.devise||"")}</div></aside><div class="ov${S.menu?" on":""}" data-a="menu"></div><div class="mn">${V0()}</div>`};
const login=()=>`<div class="lg"><main class="lc"><div class="lh"><p class="mut" style="font-weight:800;letter-spacing:.1em;font-size:12px">MAIRIE CONNECTÉE</p><h1>Espace de la mairie</h1></div><div class="lb">${S.err?`<div class="al" role="alert" style="margin:0">${esc(S.err)}</div>`:""}${inp("em","E-mail","email","","","autocomplete=\"username\"")}${inp("pw","Mot de passe","password","","","autocomplete=\"current-password\"")}<div id="ts"></div><button class="bt" data-a="enter">Se connecter</button><p class="mut" style="font-size:13px;margin:0">Les comptes sont créés par l’administrateur. Contactez-le si vous n’avez pas encore vos accès.</p></div></main></div>`;
function render(){$("#app").innerHTML=S.role=="cab"?cab():login();S.tok="";
if($("#ts")&&window.turnstile)try{turnstile.render("#ts",{sitekey:TS_KEY,language:"fr",callback:x=>{S.tok=x}})}catch(e){}
if(S.map){try{S.map.remove()}catch(e){}S.map=null}if($("#map"))initMap()}
/* actions */
document.addEventListener("click",async e=>{const t=e.target.closest("[data-a]");if(!t)return;
const a=t.dataset.a,i=+t.dataset.i,g=id=>(($("#"+id)||{}).value||"").trim(),d=D(),c=S.cid,n=id=>+g(id)||0;
if(a=="idea"){$("#pt").value=P[Math.floor(Math.random()*P.length)].replace("{c}",S.co);return}
if(a=="copy"){try{navigator.clipboard.writeText(d.posts[i].t);t.textContent="Copié"}catch(x){}return}
if(a=="useia"){$("#pt").value=(S.ia||[])[i]||"";return}
if(a=="geo"){navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{$("#jy").value=p.coords.latitude.toFixed(6);$("#jx").value=p.coords.longitude.toFixed(6)},()=>{t.textContent="Position refusée"},{enableHighAccuracy:true});return}
if(a=="print"){window.print();return}
if(a=="csv"){const k=t.dataset.k,rows=k=="projets"?[["Titre","Localité","Catégorie","Statut","Avancement","Budget"]].concat(d.proj.map(p=>[p.titre,p.localite,p.categorie,PSL[p.statut],p.avancement,p.budget])):[["Numéro","Type","Nom","Message","Statut"]].concat(d.req.map(r=>[r.n,r.t,r.w,r.m,r.st])),q=x=>'"'+String(x==null?"":x).replace(/^[=+\-@]/,"'$&").replace(/"/g,'""')+'"',u=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(";")).join("\n")],{type:"text/csv"})),l=document.createElement("a");l.href=u;l.download=k+".csv";l.click();URL.revokeObjectURL(u);return}
if(a=="ia"){const out=$("#iar");try{out.textContent="Écriture en cours…";t.disabled=true;const r=await sb.functions.invoke("ia-texte",{body:{commune:slug(),sujet:g("ps"),reseau:g("pr")}});t.disabled=false;
if(r.error){let m="IA indisponible pour le moment.";try{m=(await r.error.context.json()).error||m}catch(x){}out.textContent=m;return}
S.ia=r.data.textes||[];out.innerHTML=S.ia.map((x,k)=>`<div class="pn" style="padding:12px"><i>${esc(x)}</i><p style="margin:8px 0 0"><button class="tg" data-a="useia" data-i="${k}">Utiliser ce texte</button></p></div>`).join("")}catch(x){t.disabled=false;if(out)out.textContent="IA indisponible pour le moment."}return}
S.err="";
try{
if(a=="enter"){if(!S.tok)S.err="Veuillez valider la vérification anti-spam, puis réessayer.";else{const r=await sb.auth.signInWithPassword({email:g("em"),password:($("#pw")||{}).value||"",options:{captchaToken:S.tok}});if(r.error)S.err=r.error.message;else if(await profil())await load()}}
else if(a=="out"){S.role=null;S.cid=null;S.sa=false;S.db=E0;S.ind={};await sb.auth.signOut()}
else if(a=="menu")S.menu=!S.menu;
else if(a=="go"){S.view=t.dataset.v;S.menu=false}
else if(a=="tab")S.tab[t.dataset.g]=t.dataset.v;
else if(a=="filt")S.f=t.dataset.f;
else if(a=="sw"){const x=S.cs[i];S.co=x.name||x.nom;S.cid=x.id;await load()}
else if(a=="addcom"){const nmv=g("cn"),sl=nmv.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");if(nmv&&sl){await run(sb.from("communes").insert({slug:sl,nom:nmv}));await lcm();await load()}}
else if(a=="deluser"){const u=S.adm[i];if(u&&confirm("Supprimer définitivement le compte "+u.email+" ?")){const r=await sb.functions.invoke("admin-comptes",{body:{action:"supprimer",id:u.id}});if(r.error){try{S.err=(await r.error.context.json()).error}catch(x){S.err="Action impossible."}}else S.err="Compte supprimé.";await load()}}
else if(a=="mk"){const r=await sb.functions.invoke("admin-comptes",{body:{action:"creer",nom:g("nn"),email:g("ne"),password:($("#np")||{}).value||"",role:g("nr"),commune:g("nc")}});if(r.error){try{S.err=(await r.error.context.json()).error}catch(x){S.err="Action impossible."}}else S.err="Compte créé. Communiquez-lui son mot de passe de façon sûre.";await load()}
else{
if(a=="addrdv"){if(g("rt"))await run(sb.from("rdv").insert({commune_id:c,jour:g("rd")||T,heure:g("rh")||"09:00",titre:g("rt")}))}
else if(a=="delrdv")await run(sb.from("rdv").delete().eq("id",d.rdv[i].id));
else if(a=="addmail"){if(g("mo"))await run(sb.from("courrier").insert({commune_id:c,sens:g("ms"),correspondant:g("mf")||"Non précisé",objet:g("mo")}));S.f=g("ms")||S.f}
else if(a=="cycm"){const m=d.mail[i];await run(sb.from("courrier").update({statut:MC[(MS.indexOf(m.st)+1)%MS.length]}).eq("id",m.id))}
else if(a=="cycr"){const m=d.req[i];await run(sb.from("demandes").update({statut:RC[(RS.indexOf(m.st)+1)%RS.length]}).eq("id",m.id))}
else if(a=="addpost"){if(g("pt"))await run(sb.from("publications").insert({commune_id:c,reseau:g("pr"),jour:g("pd")||T,texte:g("pt"),media_id:g("pm")||null}))}
else if(a=="nextp"){const p=d.posts[i],k=PS.indexOf(p.st);if(k<3)await run(sb.from("publications").update({statut:PS[k+1]}).eq("id",p.id))}
else if(a=="delp")await run(sb.from("publications").delete().eq("id",d.posts[i].id));
else if(a=="addphoto"){const f=($("#pf")||{}).files&&$("#pf").files[0],ti=g("pt2");if(f&&ti){const bl=await comp(f),pa=c+"/"+crypto.randomUUID()+"."+(bl.type=="image/webp"?"webp":"jpg"),up=await sb.storage.from("medias").upload(pa,bl,{contentType:bl.type});if(up.error)S.err="Envoi impossible : "+up.error.message;else{const r=await run(sb.from("medias").insert({commune_id:c,type:"photo",titre:ti,chemin:pa}));if(!r.error)S.err="Photo enregistrée : "+kb(f.size)+" réduits à "+kb(bl.size)+"."}}else S.err="Choisissez une photo et un titre."}
else if(a=="addvideo"){if(g("vt")&&/^https:\/\//.test(g("vu")))await run(sb.from("medias").insert({commune_id:c,type:"video",titre:g("vt"),url:g("vu")}));else S.err="Indiquez un titre et un lien commençant par https://"}
else if(a=="delmed"){const m=d.med[i];if(m&&confirm("Retirer ce média ?")){if(m.ty=="photo")await sb.storage.from("medias").remove([m.p]);await run(sb.from("medias").delete().eq("id",m.id))}}
else if(a=="adddel"){if(g("dn")&&g("do"))await run(sb.from("deliberations").insert({commune_id:c,numero:g("dn"),objet:g("do"),jour:g("dj")||T,statut:g("ds")}))}
else if(a=="cycd"){const x=d.del[i],o=["adoptee","projet","rejetee"];await run(sb.from("deliberations").update({statut:o[(o.indexOf(x.statut)+1)%3]}).eq("id",x.id))}
else if(a=="deldel"){if(confirm("Retirer cette délibération ?"))await run(sb.from("deliberations").delete().eq("id",d.del[i].id))}
else if(a=="addfin"){await run(sb.from("finances").upsert({commune_id:c,annee:Y,mois:n("bm"),recettes:n("br"),depenses:n("bd")},{onConflict:"commune_id,annee,mois"}))}
else if(a=="delfin")await run(sb.from("finances").delete().eq("id",d.fin[i].id));
else if(a=="addproj"){if(g("jt")){const la=g("jy").replace(",","."),lo=g("jx").replace(",",".");await run(sb.from("projets").insert({commune_id:c,titre:g("jt"),localite:g("jl")||null,categorie:g("jc"),statut:g("js"),avancement:g("js")=="termine"?100:Math.min(100,n("ja")),budget:n("jb"),lat:la&&!isNaN(la)?+la:null,lng:lo&&!isNaN(lo)?+lo:null}))}}
else if(a=="cycp"){const p=d.proj[i],s2=PST[(PST.indexOf(p.statut)+1)%3];await run(sb.from("projets").update({statut:s2,avancement:s2=="termine"?100:(p.statut=="termine"?90:p.avancement)}).eq("id",p.id))}
else if(a=="delproj"){if(confirm("Retirer ce projet ?"))await run(sb.from("projets").delete().eq("id",d.proj[i].id))}
else if(a=="saveind"){const la=g("pla").replace(",","."),lo=g("plo").replace(",",".");await run(sb.from("indicateurs").upsert({commune_id:c,population:n("pp"),croissance:+g("pg")||0,villages:n("pv"),menages:n("pm"),agents:n("pa"),budget_annuel:n("pb"),slogan:g("psl")||null,devise:g("pdv")||null,centre_lat:la&&!isNaN(la)?+la:null,centre_lng:lo&&!isNaN(lo)?+lo:null,zoom:n("pz")||11}));if(!S.err)S.err="Paramètres enregistrés."}
else if(a=="upimg"){const k=t.dataset.k,f=($("#"+t.dataset.f)||{}).files&&$("#"+t.dataset.f).files[0];if(f){const bl=await comp(f,k=="blason"?600:1600,k=="blason"?150000:400000),pa=c+"/"+k+"-"+crypto.randomUUID()+"."+(bl.type=="image/webp"?"webp":"jpg"),up=await sb.storage.from("medias").upload(pa,bl,{contentType:bl.type});if(up.error)S.err="Envoi impossible : "+up.error.message;else{if(S.ind[k])await sb.storage.from("medias").remove([S.ind[k]]);const o={commune_id:c};o[k]=pa;await run(sb.from("indicateurs").upsert(o));if(!S.err)S.err="Image enregistrée ("+kb(bl.size)+")."}}else S.err="Choisissez d’abord une image."}
await load()}
}catch(x){S.err="Erreur réseau. Réessayez."}
render();if(a!="menu")window.scrollTo(0,0)});
document.addEventListener("change",async e=>{const t=e.target.closest("[data-ch]");if(!t)return;const p=D().proj[+t.dataset.i];if(t.dataset.ch=="avc"&&p){const v=Math.max(0,Math.min(100,+t.value||0));S.err="";await run(sb.from("projets").update({avancement:v,statut:v>=100?"termine":p.statut=="termine"?"en_cours":p.statut}).eq("id",p.id));await load();render()}});
sb.auth.onAuthStateChange((ev,ses)=>{if(S.role=="cab"&&(ev=="SIGNED_OUT"||(ses&&S.uid&&ses.user.id!==S.uid))){S.role=null;S.cid=null;S.sa=false;S.err="Votre session a changé (autre onglet ou autre compte). Reconnectez-vous.";render()}});
setInterval(()=>{const e=$(".dc div");if(e)e.innerHTML=dt()},30000);
(async()=>{try{await lcm();const x=(await sb.auth.getSession()).data.session;if(x&&await profil())await load()}catch(e){}render()})();
